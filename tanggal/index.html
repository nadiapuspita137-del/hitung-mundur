<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#070b18">
<meta name="description" content="Tanggal dan waktu WIB realtime.">
<title>Tanggal & Waktu WIB</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='24' fill='%23050816'/%3E%3Ccircle cx='50' cy='50' r='32' fill='none' stroke='%237c5cff' stroke-width='6'/%3E%3Cpath d='M50 31v20l14 8' fill='none' stroke='%2323d5ab' stroke-width='6' stroke-linecap='round'/%3E%3C/svg%3E">
<style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;color:#f8fafc;font-family:system-ui,-apple-system,"Segoe UI",sans-serif;background:radial-gradient(circle at 20% 20%,#25205b,transparent 35%),radial-gradient(circle at 80% 80%,#064b48,transparent 30%),#050816}.wrap{width:min(760px,92vw);text-align:center;padding:44px 28px;border:1px solid rgba(255,255,255,.12);border-radius:28px;background:rgba(15,22,48,.72);box-shadow:0 25px 80px rgba(0,0,0,.35);backdrop-filter:blur(10px)}.badge{display:inline-block;padding:7px 13px;border-radius:999px;background:rgba(124,92,255,.15);color:#cfc6ff;font-size:.78rem;letter-spacing:.12em;text-transform:uppercase}.date{margin-top:25px;font-size:clamp(1.5rem,5vw,2.8rem);font-weight:700}.time{margin-top:10px;font-size:clamp(3rem,10vw,6.5rem);font-weight:850;line-height:1;font-variant-numeric:tabular-nums;color:#23d5ab;text-shadow:0 0 35px rgba(35,213,171,.22)}.zone{margin-top:10px;color:#9ca8c2}.back{display:inline-block;margin-top:30px;color:#c9c1ff;text-decoration:none;border:1px solid rgba(255,255,255,.14);padding:10px 16px;border-radius:999px}.back:hover{background:rgba(124,92,255,.15)}
</style>
</head>
<body><main class="wrap"><div class="badge">Waktu Realtime</div><div class="date" id="date">Memuat...</div><div class="time" id="time">00:00:00</div><div class="zone">Waktu Indonesia Barat · WIB (UTC+7)</div><a class="back" href="../">← Kembali ke Countdown</a></main>
<script>const date=new Intl.DateTimeFormat('id-ID',{timeZone:'Asia/Jakarta',weekday:'long',day:'numeric',month:'long',year:'numeric'}),time=new Intl.DateTimeFormat('id-ID',{timeZone:'Asia/Jakarta',hour:'2-digit',minute:'2-digit',second:'2-digit',hour12:false});function update(){const n=new Date();document.getElementById('date').textContent=date.format(n);document.getElementById('time').textContent=time.format(n)+' WIB'}update();setInterval(update,1000)</script>
</body></html>
