<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><meta name="theme-color" content="#070b18"><meta name="description" content="Kalender interaktif dengan tanggal dan waktu WIB realtime."><title>Kalender - Hitung Mundur</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='22' fill='%23050816'/%3E%3Crect x='18' y='24' width='64' height='58' rx='10' fill='%237c5cff'/%3E%3Cpath d='M18 39h64M32 17v15M68 17v15' stroke='white' stroke-width='6' stroke-linecap='round'/%3E%3Ccircle cx='50' cy='60' r='7' fill='%2323d5ab'/%3E%3C/svg%3E">
<style>
*{box-sizing:border-box}:root{--bg:#060a18;--card:rgba(16,23,48,.9);--text:#f8fafc;--muted:#9da8c0;--accent:#7c5cff;--green:#23d5ab;--border:rgba(255,255,255,.12)}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:30px;color:var(--text);font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif;background:radial-gradient(circle at 15% 15%,rgba(124,92,255,.2),transparent 30%),radial-gradient(circle at 85% 85%,rgba(35,213,171,.12),transparent 30%),var(--bg)}.wrap{width:min(900px,96vw);padding:30px;border:1px solid var(--border);border-radius:28px;background:var(--card);box-shadow:0 25px 80px rgba(0,0,0,.35);backdrop-filter:blur(8px)}.top{text-align:center}.badge{display:inline-block;padding:7px 13px;border-radius:999px;background:rgba(124,92,255,.13);color:#d2cbff;font-size:.75rem;letter-spacing:.12em;text-transform:uppercase}.clock{margin-top:15px;font-size:clamp(1.8rem,5vw,3.2rem);font-weight:850;color:var(--green);font-variant-numeric:tabular-nums}.today{margin-top:5px;color:var(--muted);font-size:1rem}.calendar{margin-top:28px}.cal-head{display:flex;align-items:center;justify-content:space-between;gap:15px;margin-bottom:20px}.month-title{font-size:clamp(1.4rem,4vw,2rem);font-weight:800}.nav{width:42px;height:42px;border:1px solid var(--border);border-radius:12px;background:rgba(255,255,255,.05);color:#fff;font-size:1.2rem;cursor:pointer;transition:.2s}.nav:hover{background:rgba(124,92,255,.2);transform:translateY(-2px)}.week,.days{display:grid;grid-template-columns:repeat(7,1fr);gap:7px}.week div{text-align:center;color:#737e99;font-size:.75rem;font-weight:800;padding:7px 0}.day{min-height:58px;border:1px solid transparent;border-radius:12px;background:rgba(255,255,255,.025);color:#dce2f0;display:grid;place-items:center;position:relative;font-size:.95rem;cursor:pointer;transition:.18s}.day:hover{background:rgba(124,92,255,.15);border-color:rgba(124,92,255,.35);transform:translateY(-2px)}.day.muted{opacity:.25}.day.today{border-color:rgba(35,213,171,.65);box-shadow:inset 0 0 18px rgba(35,213,171,.08);color:#fff;font-weight:800}.day.target{background:linear-gradient(135deg,rgba(124,92,255,.35),rgba(35,213,171,.16));border-color:rgba(124,92,255,.65);font-weight:900;box-shadow:0 0 20px rgba(124,92,255,.12)}.dot{position:absolute;bottom:6px;width:4px;height:4px;border-radius:50%;background:var(--green)}.target .dot{background:#ffd166}.info{margin-top:22px;display:flex;justify-content:center;gap:10px;flex-wrap:wrap}.pill{padding:9px 13px;border:1px solid var(--border);border-radius:999px;color:#b9c3d8;font-size:.8rem}.pill strong{color:#fff}.actions{text-align:center;margin-top:25px}.back{display:inline-block;color:#c9c1ff;text-decoration:none;border:1px solid var(--border);padding:10px 17px;border-radius:999px;font-size:.85rem}.back:hover{background:rgba(124,92,255,.14)}@media(max-width:600px){body{padding:15px}.wrap{padding:20px 14px;border-radius:22px}.week,.days{gap:4px}.day{min-height:45px;border-radius:9px;font-size:.82rem}.week div{font-size:.68rem}.nav{width:38px;height:38px}.calendar{margin-top:20px}}
</style>
</head>
<body><main class="wrap"><header class="top"><div class="badge">Kalender Interaktif</div><div class="clock" id="clock">00:00:00 WIB</div><div class="today" id="today">Memuat tanggal...</div></header><section class="calendar"><div class="cal-head"><button class="nav" id="prev" aria-label="Bulan sebelumnya">‹</button><div class="month-title" id="monthTitle">Memuat...</div><button class="nav" id="next" aria-label="Bulan berikutnya">›</button></div><div class="week"><div>Sen</div><div>Sel</div><div>Rab</div><div>Kam</div><div>Jum</div><div>Sab</div><div>Min</div></div><div class="days" id="days"></div></section><div class="info"><div class="pill">Hari ini: <strong id="todayShort">-</strong></div><div class="pill">Target: <strong>2 September 2026 · 19.00 WIB</strong></div></div><div class="actions"><a class="back" href="../">← Kembali ke Countdown</a></div></main>
<script>
const TZ='Asia/Jakarta',target={y:2026,m:8,d:2},monthFmt=new Intl.DateTimeFormat('id-ID',{month:'long',year:'numeric',timeZone:TZ}),fullFmt=new Intl.DateTimeFormat('id-ID',{weekday:'long',day:'numeric',month:'long',year:'numeric',timeZone:TZ}),timeFmt=new Intl.DateTimeFormat('id-ID',{hour:'2-digit',minute:'2-digit',second:'2-digit',hour12:false,timeZone:TZ});let view=new Date();function parts(){const a=new Intl.DateTimeFormat('en-CA',{timeZone:TZ,year:'numeric',month:'2-digit',day:'2-digit'}).formatToParts(new Date()),o={};a.forEach(x=>o[x.type]=x.value);return o}function updateClock(){const n=new Date();document.getElementById('clock').textContent=timeFmt.format(n)+' WIB';document.getElementById('today').textContent=fullFmt.format(n);document.getElementById('todayShort').textContent=fullFmt.format(n)}function same(a,b){return a.getFullYear()===b.getFullYear()&&a.getMonth()===b.getMonth()&&a.getDate()===b.getDate()}function render(){const y=view.getFullYear(),m=view.getMonth();document.getElementById('monthTitle').textContent=new Intl.DateTimeFormat('id-ID',{month:'long',year:'numeric'}).format(new Date(y,m,1));const first=(new Date(y,m,1).getDay()+6)%7,last=new Date(y,m+1,0).getDate(),prevLast=new Date(y,m,0).getDate(),box=document.getElementById('days');box.innerHTML='';for(let i=0;i<42;i++){let num=i-first+1,yy=y,mm=m,muted=false;if(num<1){num=prevLast+num;mm=m-1;muted=true}else if(num>last){num-=last;mm=m+1;muted=true}const cell=document.createElement('div');cell.className='day'+(muted?' muted':'');const d=new Date(yy,mm,num);const isTarget=!muted&&y===target.y&&m===target.m&&num===target.d;const now=new Date();const isToday=!muted&&same(d,now);if(isToday)cell.classList.add('today');if(isTarget)cell.classList.add('target');cell.innerHTML=`${num}${isToday||isTarget?'<span class="dot"></span>':''}`;cell.title=isTarget?'Target countdown: 2 September 2026, 19.00 WIB':isToday?'Hari ini':'';box.appendChild(cell)}}document.getElementById('prev').onclick=()=>{view.setMonth(view.getMonth()-1);render()};document.getElementById('next').onclick=()=>{view.setMonth(view.getMonth()+1);render()};updateClock();render();setInterval(updateClock,1000);
</script></body></html>
